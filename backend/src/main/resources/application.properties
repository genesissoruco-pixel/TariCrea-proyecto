spring.application.name=optativa-iv-backend
spring.config.import=optional:file:./application-secrets.properties
server.port=${SERVER_PORT:8080}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:optativa}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=optativa-iv
app.jwt.expiration=PT2H
app.images.directory=${UPLOADS_DIR:./uploads}
app.images.max-bytes=5242880
app.images.max-dimension=8192
app.images.max-pixels=20000000
